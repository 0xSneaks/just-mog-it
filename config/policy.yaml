# JustMogIt X bot — owner policy (BUILD-SPEC-v2 §0 + owner brief 2026-11-07).
# Flip values HERE only. Code never hardcodes these. Missing key = boot refuses.

# §0 defaults (ADOPTED by Sneaks 2026-11-06)
launches_per_day: 3                 # 0.1
cost_cap_sol: "0.025"               # 0.2  creation 0.020 + priority buffer 0.005
launch_fee_sol: "0.02"              # 0.3  paid by requester before RESERVED
fee_split:                          # 0.4  Split A
  mogger: 25
  holders: 25
  bankroll: 50
trigger_policy: allowlist           # 0.5  allowlist | open
pair_quote: SOL                     # 0.6  SOL only
dev_buy_sol: "0"                    # 0.7  bot never buys its own launches
reply_budget_usd_per_day: "0.30"    # 0.8
kill_switch_on_at_boot: true        # 0.9
owner_approval_per_item: true       # 0.10 until ledger is live
x_reply_approval_ref: ""            # 0.11 X's written approval reference; EMPTY = public boot refused
image_fallback: pit_viper_template  # 0.12
claim_threshold_sol: "0.02"         # 0.13
bankroll_seed_sol: "5"              # 0.14
priority_fee_cap_sol: "0.005"       # 0.15
mog_me_enabled: false               # 0.16 off until X media-upload 403 is fixed
mog_me:                             # "mog me" X flow (bot/mogme_queue.py): owner approval queue
  autopost: false                   # legacy flag; never bypasses approval or the kill switch. Owner only.
  style: "vipers"                   # prompt: bot/mogme_queue.py VIPERS_PROMPT = justmogit-site api/mog.js vipers
  approvers: ["sneaks", "muse"]     # owner 2026-11-07: no humans besides Sneaks; Muse is the bot's friendly voice
                                    # and curates mog replies during testing. Nobody else can approve a post.
  daily_budget_max_usd: "10.00"     # owner ceiling: "10 bucks a day if it becomes really popular". Raise
                                    # daily_budget_usd to it by hand (mogme_budget_hit rows show demand).
  daily_budget_usd: "5.00"          # owner 2026-11-07: mog-me's own $/day; every Gemini try, follow lookup
                                    # and mog reply counts. Separate from reply_budget_usd_per_day (launch replies).
  min_changed_fraction: "0.06"      # "no change" check: < 6% of pixels visibly changed = fail + retry (max 2).
                                    # UNVERIFIED threshold; tune on real Gemini output.
  traits:                           # NFT-style traits, drawn once per mog (weights = relative odds)
    frame_text:                     # lettering on the frames, drawn by Gemini in the picture's style
      - {value: "PIT VIPER", weight: 1}
      - {value: null, weight: 1}    # plain glasses
    caption:                        # small corner caption, coloured from the picture's palette
      - {value: "GET MOGGED", weight: 1}
      - {value: "MOGGED BY BRAINROT LABS", weight: 1}
      - {value: null, weight: 1}
  costs_usd:                        # per try / per mog; first-try cap = floor(daily_budget / sum incl. plain_post)
    gemini_image: "0.039"           # UNVERIFIED: gemini-2.5-flash-image list price, 1290 output tokens x $30/1M
    mention_read: "0.005"           # UNVERIFIED: X pay-per-use post read (BUILD-SPEC-v2 §3)
    user_read: "0.010"              # UNVERIFIED: X pay-per-use user read (BUILD-SPEC-v2 §3)
    pose_read: "0.002"              # UNVERIFIED: one gemini-2.5-flash vision call (pose read or fit check), conservative

venue: pump.fun                     # owner 2026-11-04: pump.fun only

# Pilot allowlist (X user ids as strings). Empty = nobody can trigger.
allowlist: []

# Owner brief 2026-11-07 — PROPOSED thresholds, owner to confirm
rug:
  rule: strict                      # strict: (lp_pulled OR dev_dump) AND price_drop | any: any one signal
  dev_sold_pct_of_holdings: 50
  price_drop_pct: 70
  price_window_min: 60
wrong_pair:
  min_pair_liquidity_sol: "0.5"     # ASSUMPTION — "effectively zero" needs an owner number

description_prefix: "${ticker} was live on the wrong pair — not SOL. JustMogIt pulled the token's own picture and metadata and relaunched it paired with SOL. That's a mog. Original CA: {ca}."
description_max_chars: 1000         # ASSUMPTION — set to pump.fun's real limit before go-live

mogger:
  min_payout_sol: "0.01"            # ASSUMPTION — brief says a minimum applies; number not set
tiers:                              # owner rule set 2026-11-04; numbers are design placeholders
  - {min_pct_supply: "0",   multiplier: "1.0"}
  - {min_pct_supply: "0.5", multiplier: "1.25"}
  - {min_pct_supply: "1.0", multiplier: "1.5"}

limits:
  cooldown_per_user_min: 60
  mog_me_per_user_per_day: 1
  job_ttl_hours: 6
  reservation_ttl_min: 10
  spelling_ttl_min: 30

x_prices_usd:
  plain_post: "0.015"
  url_post: "0.200"
